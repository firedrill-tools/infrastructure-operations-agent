name: Check
on:
  push:
  pull_request:
jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12.15'
      - run: uv sync --locked --extra test
      - run: uv run --locked python scripts/build_populations.py --check
      - run: uv run --locked --extra test pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firedrill --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix firedrill
      - run: uv build
      - run: uv run --locked python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-operations-source
          path: dist/
          if-no-files-found: error
